<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recording Status Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }
        #pcContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .pcCard {
            width: 220px;
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
        }
        .pcName {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .pcStatus {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }
        .pcTimestamp {
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <h1>Recording Status (All PCs)</h1>

    <div id="pcContainer">
        Loading...
    </div>

    <script src="dashboard.js?v=2"></script>
</body>
</html>
