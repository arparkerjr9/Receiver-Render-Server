<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recording Status Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        #statusBox {
            width: 250px;
            height: 120px;
            margin: 20px auto;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
        }

        #timestamp, #pcname {
            margin-top: 15px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>Recording Status</h1>

    <div id="statusBox">Loading...</div>

    <div id="timestamp">Timestamp: --</div>
    <div id="pcname">PC: --</div>

    <!-- Cache‑buster to force browser to load new JS -->
    <script src="dashboard.js?v=2"></script>

</body>
</html>
